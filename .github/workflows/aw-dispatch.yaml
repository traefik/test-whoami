name: "Dispatch: PR events to the control repo"

on:
  pull_request_target:
    types: [opened, reopened]

# The job writes nothing in this repository; everything it needs is in the PAT.
permissions: {}

concurrency:
  group: dispatch-PR-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch workflow in the control repository
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh workflow run dispatch \
            --repo traefik/ai-test \
            --ref main \
            --field source_repo="${SOURCE_REPO}" \
            --field pr_number="${PR_NUMBER}"