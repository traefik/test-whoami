name: "Dispatch: PR events to the control repo"
on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: aw-relay-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hello-a in traefik/ai
        env:
          GH_TOKEN: ${{ secrets.AW_CONTROL_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh workflow run hello-a.yml \
            --repo traefik/ai \
            --ref main \
            --field source_repo="${SOURCE_REPO}" \
            --field pr_number="${PR_NUMBER}"
